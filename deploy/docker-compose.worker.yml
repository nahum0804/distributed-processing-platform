# Compose para las maquinas B/C/D: un worker que apunta a la maquina A via .env
# (REDIS_HOST / COORDINATOR_URL / MINIO_ENDPOINT deben ser la IP LAN o Tailscale de A).
#
# Para escalar a varios workers en la misma maquina:
#   docker compose -f deploy/docker-compose.worker.yml up -d --scale worker=2
# En ese caso WORKER_ID debe quedar vacio en .env para que cada contenedor use su propio
# hostname (ver _default_worker_id en src/workers/config.py); si se fija WORKER_ID, todas
# las replicas competirian por el mismo id de worker.

services:
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # El worker termina la subtarea en curso antes de salir (SIGTERM -> stop_event); el timeout
    # proporcional de FFmpeg puede llegar al tope de 1800 s (30 min), asi que 31m cubre el peor caso
    # sin que Docker mande SIGKILL a mitad de un transcode.
    stop_grace_period: 31m
