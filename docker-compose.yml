# Compose para la maquina A: coordinador (nativo, ver README) + redis + minio + reaper.
# NOTA: src/coordinator/main.py hoy usa redis_client = redis.Redis(host='localhost', ...)
# hardcodeado. Cuando su dueno lo cambie a REDIS_HOST/REDIS_PORT/REDIS_PASSWORD (env vars,
# igual que src/workers/config.py), el coordinador tambien podra correr como servicio
# "coordinator" en este compose apuntando a REDIS_HOST=redis. Por ahora se sigue ejecutando
# nativo con: python -m uvicorn src.coordinator.main:app --host 0.0.0.0 --port 8000

services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  reaper:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "scripts.reaper"]
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COORDINATOR_URL: ${REAPER_COORDINATOR_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
